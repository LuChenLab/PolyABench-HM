[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apa-polya-predictor"
version = "1.0.0"
description = "Standalone APA/polyA site prediction tool for Human and Mouse."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Yang Qingxin"},
]
keywords = ["polyA", "APA", "deep learning", "bioinformatics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "joblib>=1.3",
    "biopython>=1.80",
    "transformers>=4.35",
    "tokenizers>=0.19",
    "huggingface-hub>=0.20",
    "accelerate>=0.25",
    "tqdm>=4.65",
    "attrdict>=2.0",
    "packaging>=23.0",
]

[project.scripts]
apa-polya-predict = "apa_polya_predictor.cli:main"

[project.urls]
Homepage = "https://github.com/yang-qingxin/PolyABench-HM"
Repository = "https://github.com/yang-qingxin/PolyABench-HM"

[tool.setuptools.packages.find]
where = ["."]
include = ["apa_polya_predictor*"]

[tool.setuptools.package-data]
apa_polya_predictor = ["*.json", "models/deeppasta/RNAshapes"]
